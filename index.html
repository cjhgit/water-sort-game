<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>开心倒水 · Water Sort Puzzle</title>
<style>
:root{
  --bg1:#1a1040; --bg2:#0d1b3e; --bg3:#0a0f2e;
  --glass:rgba(255,255,255,.07);
  --text:#eef2ff; --muted:rgba(238,242,255,.55);
  --safeT: env(safe-area-inset-top,0px);
  --safeB: env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Roboto,"Noto Sans SC",sans-serif;
  background:radial-gradient(120% 90% at 50% 0%,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);
  color:var(--text);
  display:flex;flex-direction:column;
}
/* ── floating deco bubbles ── */
#deco{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#deco i{position:absolute;bottom:-40px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.35),rgba(255,255,255,.05));animation:rise linear infinite;opacity:.5}
@keyframes rise{to{transform:translateY(-110vh) rotate(240deg)}}

header{
  position:relative;z-index:2;
  padding:calc(var(--safeT) + 10px) 14px 6px;
  display:flex;align-items:center;gap:8px;
}
header h1{font-size:17px;font-weight:800;letter-spacing:.5px;background:linear-gradient(90deg,#8be9ff,#c39bff,#ff9ad5);-webkit-background-clip:text;background-clip:text;color:transparent;margin-right:auto;white-space:nowrap}
.btn{
  border:none;cursor:pointer;color:var(--text);
  background:var(--glass);border:1px solid rgba(255,255,255,.14);
  border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;gap:5px;backdrop-filter:blur(8px);
  transition:transform .12s,background .2s;white-space:nowrap;
}
.btn:active{transform:scale(.93)}
.btn.primary{background:linear-gradient(135deg,#5b7cfa,#8a5cf6);border-color:transparent;box-shadow:0 4px 18px rgba(110,90,250,.45)}
.btn:disabled{opacity:.4;pointer-events:none}

#hud{position:relative;z-index:2;display:flex;justify-content:center;gap:16px;padding:4px 10px 8px;font-size:12.5px;color:var(--muted)}
#hud b{color:var(--text);font-size:14px}

#stage{position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center;padding:6px 10px;min-height:0}
#board{display:grid;gap:14px 12px;justify-content:center;align-content:center;width:100%}

/* ── bottle ── */
.bottle{
  position:relative;width:var(--bw);height:var(--bh);
  cursor:pointer;transition:transform .15s ease;
  transform-origin:50% 90%;
}
.bottle.sel{transform:translateY(-12px) scale(1.05);filter:drop-shadow(0 10px 16px rgba(0,0,0,.45))}
.bottle svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.bottle .wave{animation:wave 3.2s ease-in-out infinite;transform-origin:center}
@keyframes wave{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}

/* ── overlay / modal ── */
#overlay{position:fixed;inset:0;z-index:50;background:rgba(8,6,26,.72);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
#overlay.show{opacity:1;pointer-events:auto}
.card{
  width:min(88vw,360px);background:linear-gradient(160deg,#241a52,#161238);
  border:1px solid rgba(255,255,255,.16);border-radius:22px;padding:26px 22px;
  text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.6);
  transform:scale(.9);transition:transform .25s cubic-bezier(.34,1.56,.64,1);
}
#overlay.show .card{transform:scale(1)}
.card h2{font-size:22px;font-weight:800;margin-bottom:6px}
.card p{color:var(--muted);font-size:13.5px;line-height:1.7;margin-bottom:18px}
.card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.lvlgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;max-height:46vh;overflow-y:auto;padding:2px;margin-bottom:16px}
.lvlbtn{aspect-ratio:1;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:var(--glass);color:var(--text);font-weight:700;font-size:14px;cursor:pointer;transition:transform .12s}
.lvlbtn:active{transform:scale(.9)}
.lvlbtn.done{background:linear-gradient(135deg,#1f8a4c,#2fbf6f);border-color:transparent}
.lvlbtn.cur{outline:2px solid #8be9ff;outline-offset:1px}

/* ── confetti ── */
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.confetti{position:absolute;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{0%{transform:translateY(-6vh) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(720deg);opacity:.6}}

footer{position:relative;z-index:2;text-align:center;font-size:11px;color:rgba(238,242,255,.35);padding:6px 0 calc(var(--safeB) + 8px)}
@media (max-height:600px){header h1{font-size:15px}#hud{font-size:11px;padding-bottom:4px}}
</style>
</head>
<body>
<div id="deco"></div>

<header>
  <h1>🧪 开心倒水</h1>
  <button class="btn" id="btnUndo" title="撤销">↩️ 撤销</button>
  <button class="btn" id="btnAdd" title="加一个空瓶">➕ 加瓶</button>
  <button class="btn" id="btnRestart">🔄 重开</button>
  <button class="btn primary" id="btnLevels">🗺️ 关卡</button>
</header>

<div id="hud"><span>关卡 <b id="uiLevel">1</b></span><span>步数 <b id="uiMoves">0</b></span><span>完成 <b id="uiDone">0</b>/<b id="uiTotal">0</b></span></div>

<div id="stage"><div id="board"></div></div>

<footer>点击瓶子拿起，再点击目标瓶倒水 · 同色可叠加</footer>

<div id="overlay"><div class="card" id="card"></div></div>
<div id="fx"></div>

<script>
"use strict";
/* ============================================================
   Water Sort Puzzle — single-file, mobile-first
   ============================================================ */
const CAP = 4;                       // capacity per bottle
const LEVELS = [
  /*1*/ {colors:2, empties:2},
  /*2*/ {colors:3, empties:2},
  /*3*/ {colors:3, empties:1},
  /*4*/ {colors:4, empties:2},
  /*5*/ {colors:4, empties:1},
  /*6*/ {colors:5, empties:2},
  /*7*/ {colors:5, empties:1},
  /*8*/ {colors:6, empties:2},
  /*9*/ {colors:6, empties:1},
  /*10*/{colors:7, empties:2},
  /*11*/{colors:7, empties:1},
  /*12*/{colors:8, empties:2},
  /*13*/{colors:8, empties:1},
  /*14*/{colors:9, empties:2},
  /*15*/{colors:9, empties:1},
  /*16*/{colors:10,empties:2},
  /*17*/{colors:10,empties:1},
  /*18*/{colors:11,empties:2},
  /*19*/{colors:11,empties:1},
  /*20*/{colors:12,empties:2},
];

const PALETTE = [
  ['#ff5e5e','#c22e4a'], // red
  ['#4da3ff','#2b5fc7'], // blue
  ['#51d88a','#1f9d55'], // green
  ['#ffd166','#e0a021'], // yellow
  ['#c77dff','#8b3fd6'], // purple
  ['#ff8fab','#d64570'], // pink
  ['#4ecdc4','#1f8a81'], // teal
  ['#ff9f43','#d97a1f'], // orange
  ['#a3e635','#65a30d'], // lime
  ['#94a3b8','#5b6b7f'], // steel
  ['#f472b6','#be3b88'], // magenta
  ['#7dd3fc','#2f89b5'], // sky
];

const $=s=>document.querySelector(s);
const board=$('#board'), overlay=$('#overlay'), card=$('#card');

let level=1, bottles=[], sel=-1, moves=0, animating=false;
let history=[]; // for undo
let finishedSet=loadJSON('ws_finished',[]);

function loadJSON(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function saveJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* ── seeded RNG so each level is the same puzzle for everyone ── */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,rnd){for(let i=arr.length-1;i>0;i--){const j=Math.floor(rnd()* (i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}

function genLevel(n){
  const cfg=LEVELS[Math.min(n-1,LEVELS.length-1)];
  const colors=Math.min(cfg.colors,PALETTE.length);
  let attempt=0;
  while(true){
    attempt++;
    const rnd=mulberry32(n*1000+attempt*7+3);
    const pool=[];
    for(let c=0;c<colors;c++) for(let i=0;i<CAP;i++) pool.push(c);
    shuffle(pool,rnd);
    const nb=colors+cfg.empties;
    const bs=[];
    for(let b=0;b<nb;b++) bs.push(pool.slice(b*CAP,(b+1)*CAP));
    // accept only if not accidentally solved & has at least one valid move
    if(!isSolved(bs) && anyMove(bs)) return bs;
  }
}
function anyMove(bs){
  for(let i=0;i<bs.length;i++){ if(!bs[i].length)continue;
    const top=bs[i][bs[i].length-1];
    for(let j=0;j<bs.length;j++){ if(i===j)continue;
      if(bs[j].length<CAP && (!bs[j].length||bs[j][bs[j].length-1]===top)) return true;
    }
  } return false;
}
function isSolved(bs){
  return bs.every(b=>b.length===0||(b.length===CAP&&b.every(v=>v===b[0])));
}
function uniformCount(b){ return b.length&&b.every(v=>v===b[0]) ? b.length : 0 }

/* ── rendering ── */
function layout(){
  const stage=$('#stage');
  const W=stage.clientWidth-16, H=stage.clientHeight-8;
  const total=bottles.length;
  let cols = total<=5?total : total<=8?4 : total<=12?5 : total<=15?5 : 6;
  if(W<340 && cols>4) cols=4;
  const bw=Math.min(56, Math.floor((W-(cols-1)*12)/cols), Math.floor(H*0.13));
  const bh=Math.min(200, Math.floor(bw*2.6), Math.floor((H-14-((Math.ceil(total/cols)-1)*14))/Math.ceil(total/cols)));
  document.documentElement.style.setProperty('--bw',Math.max(34,bw)+'px');
  document.documentElement.style.setProperty('--bh',Math.max(90,bh)+'px');
  board.style.gridTemplateColumns=`repeat(${cols},var(--bw))`;
}
function bottleSVG(b,idx){
  const h=b.length;
  let fills='';
  for(let i=0;i<CAP;i++){
    const yTop=32+(CAP-1-i)*34, yBot=32+(CAP-i)*34;   // glass inner: y 32..168
    const c=PALETTE[b[i]]||null;
    if(c){ fills+=`<rect class="wave" x="10" y="${yTop}" width="80" height="${34+0.5}" fill="${c[0]}"/>`; }
  }
  // bottom-most liquid gets rounded corners via clip anyway
  let surfaces='';
  for(let i=0;i<CAP;i++){
    if(b[i]===undefined) break;
    const y=32+(CAP-1-i)*34+2;
    const c=PALETTE[b[i]][0];
    surfaces+=`<rect x="10" y="${y}" width="80" height="4" rx="2" fill="${c}" opacity=".85"/>`;
  }
  const col=PALETTE[b[b.length-1]];
  const waveCol=col?col[0]:'transparent';
  return `
<svg viewBox="0 0 100 200" preserveAspectRatio="none">
  <defs>
    <clipPath id="clip${idx}"><path d="M10 26 h80 v120 q0 22 -14 28 l0 8 q0 10 -10 10 l-32 0 q-10 0 -10 -10 l0 -8 q-14 -6 -14 -28 Z"/></clipPath>
    <linearGradient id="glass${idx}" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".18" stop-color="#fff" stop-opacity=".05"/>
      <stop offset=".82" stop-color="#fff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".22"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#clip${idx})">
    <rect x="0" y="0" width="100" height="200" fill="rgba(10,12,30,.35)"/>
    ${fills}
    <g class="wave" fill="${waveCol}" opacity=".9">
      ${h?`<path d="M10 ${32+(CAP-h)*34} q10 -4 20 0 t20 0 t20 0 t20 0 v4 h-80 Z"/>`:''}
    </g>
  </g>
  <path d="M10 26 h80 v120 q0 22 -14 28 l0 8 q0 10 -10 10 l-32 0 q-10 0 -10 -10 l0 -8 q-14 -6 -14 -28 Z"
        fill="url(#glass${idx})" stroke="rgba(255,255,255,.4)" stroke-width="2.5"/>
  <rect x="6" y="18" width="88" height="10" rx="5" fill="rgba(255,255,255,.28)" stroke="rgba(255,255,255,.4)" stroke-width="1.5"/>
</svg>`;
}
function render(){
  $('#uiLevel').textContent=level;
  $('#uiMoves').textContent=moves;
  const done=bottles.filter(b=>b.length===CAP&&b.every(v=>v===b[0])).length;
  const tot=bottles.filter(b=>b.length===CAP).length;
  $('#uiDone').textContent=done; $('#uiTotal').textContent=tot;
  $('#btnUndo').disabled=!history.length;
  $('#btnAdd').disabled=animating||emptySpare()<=0;
  board.innerHTML=bottles.map((b,i)=>
    `<div class="bottle ${i===sel?'sel':''}" data-i="${i}">${bottleSVG(b,i)}</div>`).join('');
}
function emptySpare(){
  const hasEmpty=bottles.some(b=>!b.length);
  return hasEmpty?0:(12-bottles.length); // allow adding until 12 bottles
}

/* ── game actions ── */
function clickBottle(i){
  if(animating) return;
  const b=bottles[i];
  if(sel===-1){
    if(!b.length) return;
    sel=i; render(); return;
  }
  if(sel===i){ sel=-1; render(); return; }
  const src=bottles[sel], dst=b;
  if(!src.length){ sel=-1; render(); return; }
  const color=src[src.length-1];
  if(dst.length>=CAP || (dst.length&&dst[dst.length-1]!==color)){
    sel=i===sel?-1:i; // switch selection
    if(!bottles[i].length===false && dst.length>=CAP){sel=-1}
    render(); return;
  }
  // pour
  const n=Math.min(uniformCountTop(src), CAP-dst.length);
  history.push({from:sel,to:i,n});
  animating=true;
  pourAnimate(sel,i,color,n,()=>{
    for(let k=0;k<n;k++) dst.push(src.pop());
    moves++; sel=-1; animating=false; render();
    checkWin();
  });
}
function uniformCountTop(b){const c=b[b.length-1];let n=0;for(let i=b.length-1;i>=0&&b[i]===c;i--)n++;return n}

/* pour animation: lift src, tilt, spawn droplets into dst */
function pourAnimate(from,to,color,n,done){
  const els=board.querySelectorAll('.bottle');
  const A=els[from], B=els[to];
  if(!A||!B){done();return}
  const ar=A.getBoundingClientRect(), br=B.getBoundingClientRect();
  const flip = br.left < ar.left ? -1 : 1;
  A.style.transition='transform .3s ease';
  A.style.transform=`translate(${(br.left-ar.left)*.28}px, ${Math.min(ar.top,br.top)-30-ar.top}px) rotate(${28*flip}deg)`;
  // droplets
  const fx=$('#fx');
  const cx=br.left+br.width/2, cy=br.top-6;
  for(let k=0;k<n*4;k++){
    setTimeout(()=>{
      const d=document.createElement('div');
      d.className='confetti';
      d.style.cssText=`left:${cx-20+Math.random()*40}px;top:${cy}px;width:7px;height:10px;border-radius:50%;background:${PALETTE[color][0]};animation-duration:.45s;animation-name:fall2`;
      fx.appendChild(d); setTimeout(()=>d.remove(),480);
    }, k*60);
  }
  const st=document.createElement('style');st.textContent='@keyframes fall2{to{transform:translateY('+ (ar.bottom-br.top) +'px);opacity:.2}}';
  document.head.appendChild(st);setTimeout(()=>st.remove(),600);
  setTimeout(()=>{ A.style.transform=''; done(); }, 620);
}

function checkWin(){
  if(!isSolved(bottles)) return;
  if(!finishedSet.includes(level)){finishedSet.push(level);saveJSON('ws_finished',finishedSet)}
  celebrate();
  setTimeout(()=>showWin(),700);
}
function celebrate(){
  const fx=$('#fx'), colors=PALETTE.map(p=>p[0]);
  for(let i=0;i<70;i++){
    const d=document.createElement('div');
    d.className='confetti';
    d.style.cssText=`left:${Math.random()*100}vw;background:${colors[i%colors.length]};animation-duration:${1.6+Math.random()*1.6}s;animation-delay:${Math.random()*.5}s`;
    fx.appendChild(d); setTimeout(()=>d.remove(),3800);
  }
}

/* ── modals ── */
function show(cardHTML,dismiss=true){
  card.innerHTML=cardHTML;
  overlay.classList.add('show');
  overlay.onclick=e=>{ if(e.target===overlay&&dismiss) overlay.classList.remove('show') };
}
function hide(){overlay.classList.remove('show')}
function showWin(){
  const next=level<LEVELS.length?level+1:null;
  show(`<h2>🎉 太棒了！</h2>
    <p>第 <b>${level}</b> 关完成 · 用了 <b>${moves}</b> 步</p>
    <div class="row">
      ${next?`<button class="btn primary" id="mNext">➡️ 下一关</button>`:`<p>你已通关全部关卡！🎉</p>`}
      <button class="btn" id="mReplay">🔄 再玩一次</button>
      <button class="btn" id="mLevels">🗺️ 关卡列表</button>
    </div>`);
  if(next)$('#mNext').onclick=()=>{hide();loadLevel(next)};
  $('#mReplay').onclick=()=>{hide();loadLevel(level)};
  $('#mLevels').onclick=showLevels;
}
function showLevels(){
  const btns=LEVELS.map((_,i)=>{
    const n=i+1;
    const cls=finishedSet.includes(n)?'done':(n===level?'cur':'');
    return `<button class="lvlbtn ${cls}" data-l="${n}">${n}</button>`;
  }).join('');
  show(`<h2>🗺️ 选择关卡</h2><p>绿色 = 已完成</p><div class="lvlgrid">${btns}</div><div class="row"><button class="btn" id="mClose">关闭</button></div>`);
  card.querySelectorAll('.lvlbtn').forEach(b=>b.onclick=()=>{hide();loadLevel(+b.dataset.l)});
  $('#mClose').onclick=hide;
}
function loadLevel(n){
  level=n; bottles=genLevel(n); sel=-1; moves=0; history=[]; animating=false;
  layout(); render();
}

/* ── events ── */
board.addEventListener('click',e=>{
  const el=e.target.closest('.bottle');
  if(el) clickBottle(+el.dataset.i);
});
$('#btnUndo').onclick=()=>{
  if(!history.length||animating)return;
  const m=history.pop();
  for(let k=0;k<m.n;k++) bottles[m.from].push(bottles[m.to].pop());
  moves=Math.max(0,moves-1); sel=-1; render();
};
$('#btnRestart').onclick=()=>{ if(animating)return; loadLevel(level) };
$('#btnAdd').onclick=()=>{
  if(animating)return;
  if(emptySpare()<=0)return;
  bottles.push([]); sel=-1; layout(); render();
};
$('#btnLevels').onclick=showLevels;
window.addEventListener('resize',()=>{layout();render()});
document.addEventListener('gesturestart',e=>e.preventDefault());

/* deco bubbles */
(function(){
  const d=$('#deco');
  for(let i=0;i<12;i++){
    const b=document.createElement('i');
    const s=6+Math.random()*18;
    b.style.cssText=`left:${Math.random()*100}vw;width:${s}px;height:${s}px;animation-duration:${9+Math.random()*14}s;animation-delay:-${Math.random()*20}s`;
    d.appendChild(b);
  }
})();

loadLevel(level);
</script>
</body>
</html>
